name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:

  ###########################################################
  build-linux:
  ###########################################################
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        target: [linux]
        architecture: [64, arm64]
        build_system: [make, cmake, makegcc14]

        include:
          - target: linux
            runner: ubuntu-24.04
            haxe_nightly_dir: linux64
            archive_ext: tar.gz

          - target: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
            haxe_nightly_dir: linux-arm64

          - build_system: cmake
            cmake_configuration: RelWithDebInfo

    steps: &build-steps
    - name: "SCM Checkout"
      uses: actions/checkout@v7

    - name: "Add msbuild to PATH"
      if: matrix.build_system == 'vs2026'
      uses: microsoft/setup-msbuild@v3

    - name: "Mac homebrew workaround"
      if: matrix.target == 'darwin'
      run: |
        brew unlink python && brew link --overwrite python

    - name: "Install: Required Dev Packages"
      run: |
        set -ex

        case "${{ matrix.target }}" in
          linux)
            if [ ${{matrix.architecture}} == 32 ]; then
              echo "MARCH=32" >> $GITHUB_ENV
              sudo dpkg --add-architecture i386
              SUFFIX=":i386"
              EXTRA_APT_PKGS="gcc-multilib g++-multilib"
            fi

            sudo apt-get update -y
            sudo apt-get install --no-install-recommends -y \
              libmbedtls-dev${SUFFIX} \
              libopenal-dev${SUFFIX} \
              libpng-dev${SUFFIX} \
              libturbojpeg-dev${SUFFIX} \
              libuv1-dev${SUFFIX} \
              libvorbis-dev${SUFFIX} \
              libsqlite3-dev${SUFFIX} \
              pkg-config \
              ${EXTRA_APT_PKGS}

            sudo apt-get install --no-install-recommends -y \
              libasound2-dev \
              libpulse-dev \
              libaudio-dev \
              libjack-dev \
              libsndio-dev \
              libx11-dev \
              libxext-dev \
              libxrandr-dev \
              libxcursor-dev \
              libxfixes-dev \
              libxi-dev \
              libxss-dev \
              libxtst-dev \
              libxkbcommon-dev \
              libdrm-dev \
              libgbm-dev \
              libgl1-mesa-dev \
              libgles2-mesa-dev \
              libegl1-mesa-dev \
              libdbus-1-dev \
              libibus-1.0-dev \
              libudev-dev \
              libpipewire-0.3-dev \
              libwayland-dev \
              libdecor-0-dev \
              liburing-dev
            ;;

          darwin)
            if [ "${{matrix.build_system}}" != "cmake" ]; then
              brew update
              HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew bundle --no-upgrade
            fi
            brew install sdl3 sdl3_image
            ;;

          windows)
            if [[ ${{ matrix.build_system }}${{ matrix.architecture }} == cmake-mingw32 ]]; then
              echo "C:\mingw32\bin" >> $GITHUB_PATH
            fi

            if [[ ${{ matrix.build_system }} == cmake-mingw ]]; then
              SDL_SUFFIX=mingw
            else
              SDL_SUFFIX=VC
            fi

            curl -fsSL --retry 3 --retry-delay 5 -o /tmp/sdl.zip https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-devel-3.4.10-${SDL_SUFFIX}.zip
            curl -fsSL --retry 3 --retry-delay 5 -o /tmp/sdl_image.zip https://github.com/libsdl-org/SDL_image/releases/download/release-3.4.0/SDL3_image-devel-3.4.0-${SDL_SUFFIX}.zip
            curl -fsSL --retry 3 --retry-delay 5 -o /tmp/openal.zip https://github.com/kcat/openal-soft/releases/download/1.23.1/openal-soft-1.23.1-bin.zip
            curl -fsSL --retry 3 --retry-delay 5 -o /tmp/ffmpeg.zip ${{ matrix.ffmpeg_url }}

            7z x /tmp/sdl.zip -oinclude
            mv include/SDL3-* include/sdl

            7z x /tmp/sdl_image.zip -oinclude
            mv include/SDL3_image-* include/sdl-image

            if [[ ${{ matrix.build_system }} == cmake-mingw ]]; then
              cp -r include/sdl/x86_64-w64-mingw32/* include/sdl/
              cp -r include/sdl-image/x86_64-w64-mingw32/* include/sdl-image/
            fi

            7z x /tmp/openal.zip -oinclude
            mv include/openal* include/openal

            7z x /tmp/ffmpeg.zip -oinclude
            mv include/ffmpeg* include/ffmpeg

            WIN_PWD=$(cygpath -m "$(pwd)")
            echo "SDL_PREFIX=${WIN_PWD}/include/sdl;${WIN_PWD}/include/sdl-image" >> $GITHUB_ENV
            ;;
        esac

    - name: "Download: DirectX binaries for windows + make"
      if: matrix.target == 'windows' && matrix.build_system != 'cmake' && matrix.build_system != 'cmake-mingw'
      run: |
        curl -fsSL --retry 3 --retry-delay 5 -o /tmp/dx.zip https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.8.2505.1/dxc_2025_07_14.zip
        7z x /tmp/dx.zip -oinclude/dx

    - name: "Install: GCC 14"
      if: matrix.build_system == 'makegcc14'
      run: |
        sudo add-apt-repository universe
        sudo apt update
        sudo apt install -y gcc-14 g++-14
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 60 --slave /usr/bin/g++ g++ /usr/bin/g++-14
        if [[ ${{ matrix.architecture }} == 32 ]]; then
          sudo apt install -y gcc-14-multilib g++-14-multilib
        fi
        gcc --version

    - name: Install haxe
      uses: krdlab/setup-haxe@v2
      with:
        haxe-version: latest

    - name: "Configure: Haxelib"
      run: |
        set -eux
        haxelib setup ~/haxelib
        haxelib install hashlink
        haxelib list

    - name: "Build and install SDL3 & SDL3_image"
      if: runner.os == 'Linux'
      run: |
        set -eux
        curl -fsSL --retry 3 --retry-delay 5 -o /tmp/SDL3.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-3.4.10.tar.gz
        tar -xzf /tmp/SDL3.tar.gz -C /tmp
        cmake -S /tmp/SDL3-3.4.10 -B /tmp/SDL3-build -DCMAKE_BUILD_TYPE=Release
        cmake --build /tmp/SDL3-build --parallel
        sudo cmake --install /tmp/SDL3-build
        sudo ldconfig

        curl -fsSL --retry 3 --retry-delay 5 -o /tmp/SDL3_image.tar.gz https://github.com/libsdl-org/SDL_image/releases/download/release-3.4.0/SDL3_image-3.4.0.tar.gz
        tar -xzf /tmp/SDL3_image.tar.gz -C /tmp
        cmake -S /tmp/SDL3_image-3.4.0 -B /tmp/SDL3_image-build \
          -DCMAKE_BUILD_TYPE=Release \
          -DSDLIMAGE_VENDORED=OFF
        cmake --build /tmp/SDL3_image-build --parallel
        sudo cmake --install /tmp/SDL3_image-build
        sudo ldconfig

    - name: "Build: HashLink"
      run: |
        set -eux

        case "${{ matrix.build_system }}" in
          cmake)
            case "${{ matrix.target }}${{ matrix.architecture }}" in
              windows*)
                cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.cmake_configuration }} \
                  -G "${{ matrix.cmake_generator }}" \
                  -A ${{ matrix.architecture_string }} \
                  -DCMAKE_PREFIX_PATH="${{ env.SDL_PREFIX }}"
                ;;
              darwin64)
                cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.cmake_configuration }} \
                  -DDOWNLOAD_DEPENDENCIES=ON \
                  -DCMAKE_OSX_ARCHITECTURES=x86_64 \
                  -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
                  -DFLAT_INSTALL_TREE=ON \
                  -DCMAKE_PREFIX_PATH="$(brew --prefix)"
                ;;
              darwinarm64)
                cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.cmake_configuration }} \
                  -DDOWNLOAD_DEPENDENCIES=ON \
                  -DCMAKE_OSX_ARCHITECTURES=arm64 \
                  -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
                  -DFLAT_INSTALL_TREE=ON \
                  -DCMAKE_PREFIX_PATH="$(brew --prefix)"
                ;;
              linux32)
                cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.cmake_configuration }} -DWITH_SDL=OFF \
                  -DCMAKE_TOOLCHAIN_FILE=other/cmake/linux32.toolchain.cmake
                ;;
              linux*)
                cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.cmake_configuration }}
                ;;
            esac

            cmake --build build --config ${{ matrix.cmake_configuration }}
            BUILD_FOLDER=build/bin
            ;;

          cmake-mingw)
            cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.cmake_configuration }} \
              -DWITH_DX12=OFF -DWITH_VULKAN=OFF \
              -DCMAKE_PREFIX_PATH="${{ env.SDL_PREFIX }}"

            cmake --build build --config ${{ matrix.cmake_configuration }} --parallel
            BUILD_FOLDER=build/bin
            ;;

          cmake-clang-cl)
            cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.cmake_configuration }} \
              -G "${{ matrix.cmake_generator }}" \
              -A ${{ matrix.architecture_string }} \
              -T ClangCL \
              -DCMAKE_PREFIX_PATH="${{ env.SDL_PREFIX }}"
            cmake --build build --config ${{ matrix.cmake_configuration }}
            BUILD_FOLDER=build/bin
            ;;

          vs2026)
            python -c 'import re, pathlib; p = pathlib.Path("libs/fmt/fmt.vcxproj"); text = re.sub(r"\s*<ClCompile Include=\"\.\.\\\.\.\\include\\(?:png|turbojpeg)\\[^\"]*\"\s*/>", "", p.read_text(encoding="utf-8")); inject = "  <ItemDefinitionGroup><ClCompile><AdditionalIncludeDirectories>..\\..\\include\\sdl\\include;..\\..\\include\\sdl-image\\include;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories></ClCompile><Link><AdditionalLibraryDirectories>..\\..\\include\\sdl\\lib\\x64;..\\..\\include\\sdl-image\\lib\\x64;%(AdditionalLibraryDirectories)</AdditionalLibraryDirectories><AdditionalDependencies>SDL3.lib;SDL3_image.lib;%(AdditionalDependencies)</AdditionalDependencies></Link></ItemDefinitionGroup>\n</Project>"; p.write_text(text.replace("</Project>", inject), encoding="utf-8")'

            MSBuild.exe hl.sln //nologo //m //clp:ErrorsOnly \
              //p:Configuration=${{ matrix.msbuild_configuration }} \
              //p:Platform=${{ matrix.architecture_string }}

            case "${{ matrix.architecture }}" in
              64) BUILD_FOLDER=x64/${{ matrix.msbuild_configuration }} ;;
              32) BUILD_FOLDER=${{ matrix.msbuild_configuration }} ;;
            esac
            cp include/sdl/lib/x64/SDL3.dll "$BUILD_FOLDER/"
            cp include/sdl-image/lib/x64/SDL3_image.dll "$BUILD_FOLDER/"
            echo "WINDOWS_BUILD_FOLDER=$BUILD_FOLDER" >> $GITHUB_ENV
            ;;

          make*)
            if [[ ${{ matrix.target }}${{ matrix.architecture }} == linux32 ]]; then
              make -o sdl.hdll
            else
              make
            fi
            sudo make install
            if [[ ${{ matrix.target }} == linux ]]; then
              sudo ldconfig
            fi
            BUILD_FOLDER=.
            ;;
        esac

        ls -l $BUILD_FOLDER

    - name: "Test"
      run: |
        set -eux

        case "${{ matrix.build_system }}" in
          cmake*)
            case "${{matrix.target}}" in
              windows)
                if [[ ${{ matrix.build_system }} == cmake-mingw ]]; then
                  export PATH="$(pwd)/build/bin:$(pwd)/include/sdl/x86_64-w64-mingw32/bin:$(pwd)/include/sdl-image/x86_64-w64-mingw32/bin:$PATH"
                else
                  export PATH="$(pwd)/build/bin:$(pwd)/include/sdl/lib/x64:$(pwd)/include/sdl-image/lib/x64:$PATH"
                fi
                ;;
              *)
                cmake --install build --prefix /tmp/hashlink
                if [ -f /tmp/hashlink/hl ]; then /tmp/hashlink/hl --version; fi
                ;;
            esac
            cd build && ctest --verbose --build-config ${{ matrix.cmake_configuration }}
            ;;
          vs2026)
            ${{ env.WINDOWS_BUILD_FOLDER }}/hl.exe --version
            ;;
          make*)
            if [[ ${{ matrix.architecture }} != arm64 ]]; then
              ./hl --version
              case ${{ matrix.target }} in
                linux)  ldd -v ./hl ;;
                darwin) otool -L ./hl ;;
              esac

              haxe -hl hello.hl -cp other/tests -main HelloWorld -D interp \
                ${{ matrix.architecture == 32 && '-D hl-legacy32' || '' }}
              ./hl hello.hl

              cp hello.hl /tmp
              pushd /tmp
              hl hello.hl
              popd
            fi

            haxe -hl src/_main.c -cp other/tests -main HelloWorld
            make hlc
            ./hlc
            ;;
        esac

    - name: "Test haxelib build"
      run: |
        haxelib git format https://github.com/HaxeFoundation/format
        cd other/haxelib
        haxe memory.hxml
        haxe profiler.hxml
        cd ../..

    - name: "Package"
      run: |
        set -eux

        case "${{ matrix.target }}${{matrix.architecture}}" in
          darwinarm64)   platform_name=darwin-arm64 ;;
          darwin64)      platform_name=darwin ;;
          windows*)      platform_name=win${{matrix.architecture}} ;;
          linux32)       platform_name=linux-i386 ;;
          linux64)       platform_name=linux-amd64 ;;
          linuxarm64)    platform_name=linux-arm64 ;;
        esac

        short_commit=$(git rev-parse --short HEAD)

        case "${{ matrix.build_system }}" in
          cmake*)
            dist_folder=hashlink-${short_commit}-${platform_name}-${{ matrix.build_system }}
            cd build && cpack -D CPACK_PACKAGE_FILE_NAME=$dist_folder -C ${{ matrix.cmake_configuration }}

            echo "HASHLINK_DISTRIBUTION=build/bin/$dist_folder.${{ matrix.archive_ext }}" >> $GITHUB_ENV
            ;;
          *)
            dist_folder=hashlink-${short_commit}-${platform_name}
            make PACKAGE_NAME=$dist_folder MARCH=${{ matrix.architecture }} release

            echo "HASHLINK_DISTRIBUTION=$dist_folder.${{ matrix.archive_ext }}" >> $GITHUB_ENV
            ;;
        esac

    - name: "Share: build artifact"
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.target }}-${{ matrix.build_system }}-${{ matrix.architecture }}
        path: ${{ env.HASHLINK_DISTRIBUTION }}

  ###########################################################
  build-darwin:
  ###########################################################
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        target: [darwin]
        architecture: [64, arm64]
        build_system: [make, cmake]

        exclude:
          - architecture: 64
            build_system: make

        include:
          - target: darwin
            haxe_nightly_dir: mac
            archive_ext: tar.gz

          - target: darwin
            architecture: 64
            runner: macos-15-intel

          - target: darwin
            architecture: arm64
            runner: macos-latest

          - build_system: cmake
            cmake_configuration: RelWithDebInfo

    steps: *build-steps

  ###########################################################
  build-windows:
  ###########################################################
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        target: [windows]
        architecture: [64]
        build_system: [cmake, cmake-mingw, cmake-clang-cl, vs2026]

        include:
          - target: windows
            runner: windows-2025
            haxe_nightly_dir: windows64
            archive_ext: zip
            ffmpeg_url: https://github.com/HaxeFoundation/hashlink/files/5648056/ffmpeg-3.4.2-win64-dev.zip
            architecture_string: x64

          - build_system: cmake
            cmake_configuration: RelWithDebInfo
            cmake_generator: Visual Studio 18 2026

          - build_system: cmake-mingw
            cmake_configuration: RelWithDebInfo

          - build_system: cmake-clang-cl
            cmake_configuration: RelWithDebInfo
            cmake_generator: Visual Studio 18 2026

          - build_system: vs2026
            msbuild_configuration: Release

    steps: *build-steps

  ###########################################################
  build-android:
  ###########################################################
    runs-on: ubuntu-latest
    steps:

    - name: "SCM Checkout"
      uses: actions/checkout@v7

    - name: Install haxe
      uses: krdlab/setup-haxe@v2
      with:
        haxe-version: latest

    - name: "Configure: Haxelib"
      run: |
        set -eux
        haxelib setup ~/haxelib
        haxelib install hashlink
        haxelib list

    - name: "Build SDL3 & SDL3_image for Android"
      run: |
        set -eux
        curl -fsSL --retry 3 --retry-delay 5 -o /tmp/SDL3.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-3.4.10.tar.gz
        tar -xzf /tmp/SDL3.tar.gz -C /tmp
        cmake -S /tmp/SDL3-3.4.10 -B /tmp/SDL3-android -G Ninja \
          --toolchain $ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_PLATFORM=24 -DANDROID_ABI=arm64-v8a \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/tmp/android-deps
        cmake --build /tmp/SDL3-android
        cmake --install /tmp/SDL3-android

        curl -fsSL --retry 3 --retry-delay 5 -o /tmp/SDL3_image.tar.gz https://github.com/libsdl-org/SDL_image/releases/download/release-3.4.0/SDL3_image-3.4.0.tar.gz
        tar -xzf /tmp/SDL3_image.tar.gz -C /tmp
        cmake -S /tmp/SDL3_image-3.4.0 -B /tmp/SDL3_image-android -G Ninja \
          --toolchain $ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_PLATFORM=24 -DANDROID_ABI=arm64-v8a \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_FIND_ROOT_PATH=/tmp/android-deps \
          -DCMAKE_PREFIX_PATH=/tmp/android-deps \
          -DCMAKE_INSTALL_PREFIX=/tmp/android-deps \
          -DSDLIMAGE_VENDORED=OFF \
          -DSDLIMAGE_AVIF=OFF -DSDLIMAGE_JXL=OFF -DSDLIMAGE_TIF=OFF -DSDLIMAGE_WEBP=OFF
        cmake --build /tmp/SDL3_image-android
        cmake --install /tmp/SDL3_image-android

    - name: "Build: Hashlink"
      run: |
        set -ex
        cmake -B build -G Ninja --toolchain $ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_PLATFORM=24 -DANDROID_ABI=arm64-v8a -DBUILD_SHARED_LIBS=OFF -DWITH_VM=OFF \
          -DCMAKE_FIND_ROOT_PATH=/tmp/android-deps \
          -DCMAKE_PREFIX_PATH=/tmp/android-deps
        cmake --build build

  ###########################################################
  haxe-test-linux:
  ###########################################################
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        os: [linux]
        architecture: [x86_64, arm64]
        include:
        - architecture: arm64
          test-flags: --skip-hl-jit

        - os: linux
          runner: ubuntu-24.04
          build_system: make

        - os: linux
          architecture: arm64
          runner: ubuntu-24.04-arm
          build_system: make

    runs-on: ${{ matrix.runner }}
    steps: &haxe-test-steps
    - uses: actions/checkout@v7
    - name: Download binary
      uses: actions/download-artifact@v8
      with:
        name: |
          ${{ matrix.os }}-${{ matrix.build_system }}-${{
            matrix.architecture == 'arm64' && 'arm64' ||
            matrix.architecture == 'x86_64' && '64' ||
            matrix.architecture == 'x86_32' && '32'
          }}

    - name: Install apt packages
      if: matrix.os == 'linux'
      run: |
        if [ ${{matrix.architecture}} == x86_32 ]; then
          sudo dpkg --add-architecture i386
          SUFFIX=":i386"
          EXTRA_APT_PKGS="gcc-multilib"
          printf '#!/bin/sh\n/usr/bin/gcc -m32 "$@"\n' > /usr/local/bin/gcc
          chmod +x /usr/local/bin/gcc
        fi
        sudo apt-get update -qqy
        sudo apt-get install -qqy libpng16-16t64${SUFFIX} libjpeg-turbo8${SUFFIX} libturbojpeg${SUFFIX} zlib1g${SUFFIX} libogg0${SUFFIX} libvorbis0a${SUFFIX} \
          libvorbisfile3${SUFFIX} libvorbisenc2${SUFFIX} libsqlite3-0${SUFFIX} libmbedtls14t64${SUFFIX} ${EXTRA_APT_PKGS}

    - name: Install brew packages
      if: matrix.os == 'darwin' && matrix.build_system == 'make'
      run: |
        brew update
        brew install libpng jpeg-turbo libvorbis sqlite mbedtls sdl3 sdl3_image

    - name: Install msbuild
      uses: microsoft/setup-msbuild@v3
      if: matrix.os == 'windows'
      with:
        msbuild-architecture: ${{ matrix.architecture == 'x86_64' && 'x64' || 'x86' }}

    - name: Setup mingw
      if: matrix.os == 'windows' && matrix.architecture == 'x86_32'
      run: echo "C:\mingw32\bin" >> $GITHUB_PATH

    - name: Install binary (Linux/Mac)
      if: matrix.os != 'windows'
      run: |
        tar -xvzf hashlink-*.tar.gz
        cd $(echo hashlink-*/)
        sudo mkdir -p /usr/local/{bin,lib,include}
        if [[ "${{ matrix.architecture }}" == "arm64" ]]; then
          printf "#!/bin/sh\necho Jit is not supported on arm64\n" > /usr/local/bin/hl
          chmod +x /usr/local/bin/hl
        else
          sudo cp hl /usr/local/bin/
        fi
        sudo cp libhl.* *.hdll /usr/local/lib/
        if [[ "${{ matrix.os }}-${{ matrix.build_system }}" == "darwin-cmake" ]]; then
          sudo cp *.dylib /usr/local/lib/
          otool -L *.hdll
        fi
        sudo cp include/* /usr/local/include/
        if [[ "${{ matrix.os }}" == "linux" ]]; then
          sudo ldconfig
        fi

    - name: Install binary (Windows)
      if: matrix.os == 'windows'
      run: |
        unzip hashlink-*.zip
        echo $(cygpath -w $(pwd)/hashlink-*/) >> $GITHUB_PATH

    - name: Check binary
      run: hl --version

    - uses: krdlab/setup-haxe@v2
      with:
        haxe-version: latest

    - name: Setup haxelib
      run: haxelib dev hashlink ./other/haxelib

    - name: Get Haxe commit SHA
      id: haxe_sha
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(haxe --version)
        echo "Haxe version: $version"
        short_sha=${version##*+}
        full_sha=$(gh api repos/HaxeFoundation/haxe/commits/$short_sha --jq '.sha')
        echo "Commit SHA: $short_sha, Full SHA: $full_sha"
        echo "sha=$full_sha" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v7
      with:
        repository: HaxeFoundation/haxe
        path: haxe
        ref: ${{ steps.haxe_sha.outputs.sha }}

    - name: Test
      timeout-minutes: 20
      run: |
        if [[ "${{ matrix.os }}" == "darwin" ]]; then
          echo "" > sys/compile-fs.hxml
        fi
        haxe --run RunCi hl ${{ matrix.test-flags }}
      working-directory: haxe/tests

  ###########################################################
  haxe-test-darwin:
  ###########################################################
    needs: build-darwin
    env:
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    strategy:
      fail-fast: false
      matrix:
        os: [darwin]
        architecture: [x86_64, arm64]
        include:
        - architecture: arm64
          test-flags: --skip-hl-jit

        - os: darwin
          runner: macos-15-intel
          build_system: cmake

        - os: darwin
          architecture: arm64
          runner: macos-latest
          build_system: make

    runs-on: ${{ matrix.runner }}
    steps: *haxe-test-steps

  ###########################################################
  haxe-test-windows:
  ###########################################################
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        os: [windows]
        architecture: [x86_64]
        include:
        - os: windows
          runner: windows-2025
          build_system: vs2026

    runs-on: ${{ matrix.runner }}
    steps: *haxe-test-steps

  ###########################################################
  publish-latest-release:
  ###########################################################
    runs-on: ubuntu-latest
    needs: [build-linux, build-darwin, build-windows, haxe-test-linux, haxe-test-darwin, haxe-test-windows]
    if: github.ref == 'refs/heads/master'
    concurrency: publish-latest-release

    steps:

    - name: "SCM Checkout"
      uses: actions/checkout@v7

    - name: "Get: all build artifacts"
      uses: actions/download-artifact@v8
      with:
        path: _artifacts
        skip-decompress: true

    - name: "Extract build artifacts"
      run: |
        set -eu
        for zip in _artifacts/*/*; do
          unzip -q "$zip" -d "$(basename "$(dirname "$zip")")"
        done

    - name: "Delete previous 'latest' release"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -eu
        gh release delete latest --cleanup-tag --yes || true

    - name: "Create 'latest' Release"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -eux

        short_commit=$(git rev-parse --short HEAD)

        gh release create latest \
          --prerelease \
          --title "HashLink Nightly Build" \
          "darwin-cmake-64/hashlink-${short_commit}-darwin-cmake.tar.gz#hashlink-latest-darwin.tar.gz" \
          "darwin-cmake-arm64/hashlink-${short_commit}-darwin-arm64-cmake.tar.gz#hashlink-latest-darwin-arm64.tar.gz" \
          "linux-make-64/hashlink-${short_commit}-linux-amd64.tar.gz#hashlink-latest-linux-amd64.tar.gz" \
          "linux-make-arm64/hashlink-${short_commit}-linux-arm64.tar.gz#hashlink-latest-linux-arm64.tar.gz" \
          "windows-vs2026-64/hashlink-${short_commit}-win64.zip#hashlink-latest-win64.zip" \
          "windows-cmake-mingw-64/hashlink-${short_commit}-win64-cmake-mingw.zip#hashlink-latest-win64-mingw.zip"